name: layer-research
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - pandas
  - pyyaml
  - tqdm
  - pytest
  - matplotlib
  - pip:
      - --index-url https://download.pytorch.org/whl/cpu
      - --extra-index-url https://pypi.org/simple
      - torch>=2.3
      - torchvision
      - setuptools<81   # imagecorruptions still imports pkg_resources
      - timm>=1.0
      - imagecorruptions
      - wand
      - scikit-image
      - scikit-learn
      - opencv-python-headless
