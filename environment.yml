name: layer-research
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pyyaml
  - tqdm
  - pytest
  - matplotlib
  - pip:
      - --index-url https://download.pytorch.org/whl/cpu
      - --extra-index-url https://pypi.org/simple
      - torch>=2.3
      - torchvision
      - setuptools<81   # imagecorruptions still imports pkg_resources
      # numpy/scipy/pandas come from pip on purpose: conda's MKL builds crash alongside the pip torch wheel on Windows
      - numpy
      - scipy
      - pandas
      - pyarrow
      - timm>=1.0
      - imagecorruptions
      - wand
      - scikit-image
      - scikit-learn
      - opencv-python-headless
