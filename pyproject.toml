[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layer-research"
version = "0.0.1"
description = "Budget-constrained intervention site selection in vision models"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"   # default %TEMP%/pytest-of-<user> is not writable on the dev machine
